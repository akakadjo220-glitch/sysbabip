server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # En-têtes de sécurité (hérités par les blocs location sans add_header propre).
    # Pas encore de Content-Security-Policy : à ajouter après inventaire des
    # domaines tiers (Paystack, Mapbox, Supabase, polices...).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Compression (réseaux mobiles : moins de données, pages plus rapides).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    root   /usr/share/nginx/html;

    # Fichiers compilés par Vite : nom unique à chaque version → cache 1 an.
    # (« expires » n'empêche pas l'héritage des add_header de sécurité ci-dessus.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # La page d'entrée doit toujours être revalidée pour charger la dernière version.
    location = /index.html {
        expires -1;
    }

    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
